version: "3.9"

services:
  app:
    image: ${DOCKER_USERNAME}/graphqlgo:latest
    container_name: graphqlgo-prod
    restart: always
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_PORT: 8080
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    networks:
      - pruebas-graphql

networks:
  pruebas-graphql:
    driver: bridge
