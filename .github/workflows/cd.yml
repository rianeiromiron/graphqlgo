name: Go CD

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Run tests
        run: go test ./...

      - name: Build app
        run: go build ./...

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/graphqlgo:latest

      - name: Prepare deployment env
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
          echo "DB_HOST=${{ secrets.DB_HOST || 'host.docker.internal' }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT || '5432' }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER || 'postgres' }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME || 'gestion_documentos' }}" >> .env
          echo "DB_SSLMODE=${{ secrets.DB_SSLMODE || 'disable' }}" >> .env

      - name: Show generated deployment env
        run: cat .env
